kind = "web"
previewPath = "/"
title = "TRIesa Luxury Hotel"
description = "A cinematic luxury hotel website for TRIesa, blending architectural storytelling, suite discovery, dining, wellness, experiences, gallery exploration, and a polished booking experience."
version = "1.0.0"
id = "artifacts/triesa-hotel"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23996

[services.development]
run = "pnpm --filter @workspace/triesa-hotel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/triesa-hotel", "run", "build" ]
serve = "static"
publicDir = "artifacts/triesa-hotel/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23996"
BASE_PATH = "/"
